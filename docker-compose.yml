name: homesite-compose

services:
  homesite:
    image: ${DOCKER_REGISTRY-}homesite
    container_name: homesite
    build:
      context: .
      dockerfile: HomeSite/Dockerfile
    restart: always
    environment:
      - HOST_SERVERS_PATH=${PWD}/hs_data/servers
    depends_on:
      - db
    user: root
    labels:
      - caddy=localhost
      - caddy.reverse_proxy={{upstreams 8080}}
    networks:
      - default
      - mc_network
    volumes:
      - ./config.json:/app/Config/config.json
      - ./hs_data/UserStorage:/app/Share
      - /var/run/docker.sock:/var/run/docker.sock
      - ./hs_data/servers:/app/servers
    ports: []


  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - hs_pg_data:/var/lib/postgresql/data
    restart: always

  mc_proxy:
    image: itzg/mc-router
    container_name: mc_proxy
    environment:
      - IN_DOCKER=true
    ports:
      - "25565:25565"
    networks:
      - mc_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  proxy:
    image: lucaslorentz/caddy-docker-proxy:latest
    container_name: proxy
    restart: always
    depends_on:
      - homesite
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_INGRESS_NETWORKS=mc_network
    networks:
      - mc_network
      - default
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
      - caddy_config:/config

networks:
  mc_network:
    name: mc_network
    driver: bridge

volumes:
  hs_pg_data:
  caddy_data:
  caddy_config:
